name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d etl"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Wait for Postgres
        env:
          PG_PASSWORD: postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres -d etl; do sleep 1; done

      - name: Run migrations / init SQL
        env:
          PG_PASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d etl -f sql/ddl.sql

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: etl
        run: |
          pytest -v

      - name: Build docker (optional)
        run: docker compose build

      - name: Run docker compose (optional)
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: etl
        run: |
          docker compose up --abort-on-container-exit --exit-code-from app
